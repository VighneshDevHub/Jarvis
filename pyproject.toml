[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS - AI Automation System for Windows"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "loguru",
    "pydantic-settings",
    "python-dotenv",
    "psutil",
    "winotify",
    "requests",
    "pyautogui",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]